name: Build Dreame Vacuum Card

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish test build
        run: |
          cp dist/dreame-vacuum-overlay-card.js dreame-vacuum-overlay-card.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dreame-vacuum-overlay-card.js
          if git diff --cached --quiet; then
            echo "Build output unchanged"
          else
            git commit -m "build: publish overlay card"
            git push
          fi
