name: Bootstrap upstream source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-upstream.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import upstream source
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -L https://github.com/noambergauz/dreame-vacuum-map-card/archive/refs/heads/master.tar.gz -o "$tmp/upstream.tar.gz"
          tar -xzf "$tmp/upstream.tar.gz" -C "$tmp"
          rsync -a --delete --exclude='.git' --exclude='.github/' "$tmp/dreame-vacuum-map-card-master/" ./
          cp "$0" /dev/null 2>/dev/null || true
      - name: Preserve bootstrap workflow
        run: |
          git checkout -- .github/workflows/bootstrap-upstream.yml || true
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: import upstream dreame vacuum map card"
            git push
          fi
